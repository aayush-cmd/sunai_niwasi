<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>हम निवासी - Niwasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Navbar -->
 <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="navbar">
    <div class="container-fluid px-4">
      <!-- Logo Section -->
      <a class="navbar-brand" href="index.html">
        <img src="image/logo-transparent.png" alt="हम निवासी लोगो" height="60" />
      </a>
      
   
    </div>
  </nav>


  <!-- Registration Form Section -->
  <section class="registration-section" style="background-color: #fdf6e3; min-height: 100vh; padding: 100px 0 50px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="registration-card" style="background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);">
            <h4 class="text-center mb-4 pb-4" style="color: #5a3e2b; font-weight: 700;">हमारे समुदाय में शामिल होने और सामाजिक उद्यमी बनने के लिए संपर्क करें</h4>
            <!-- <p class="text-center mb-4" style="color: #e8430a; font-size: 18px; font-weight: 600;">हमारे समुदाय में शामिल होने और सामाजिक उद्यमी बनने के लिए</p> -->
            
            <form class="registration-form">
              <!-- Two Column Layout -->
              <div class="row">
                <!-- First Row -->
                <div class="col-md-6 mb-3">
                  <label for="firstName" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                    नाम का पहला शब्द
                  </label>
                  <input type="text" id="firstName" class="form-input" placeholder="अपना पहला नाम दर्ज करें" required
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s ease;">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                    नाम का दूसरा शब्द
                  </label>
                  <input type="text" id="lastName" class="form-input" placeholder="अपना दूसरा नाम दर्ज करें" required
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s ease;">
                </div>
              </div>

              <!-- Second Row -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="mobile" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                    मोबाइल नंबर
                  </label>
                  <input type="tel" id="mobile" class="form-input" placeholder="अपना मोबाइल नंबर दर्ज करें" required
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s ease;">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="email" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                    ईमेल आईडी
                  </label>
                  <input type="email" id="email" class="form-input" placeholder="अपना ईमेल आईडी दर्ज करें" required
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s ease;">
                </div>
              </div>

              <!-- Fourth Row -->
              <div class="row">
                 <div class="col-md-6 mb-3">
                  <label for="community" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                   क्षेत्र का नाम जहाँ सामाजिक उद्यमी के रूप में कार्य करना चाहेंगे(लिस्ट से)
                  </label>
                  <select id="community" class="form-input" required
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background-color: white;">
                    <option value=""> समुदाय चुनें</option>
                    <option value="urban">नगर समुदाय</option>
                    <option value="rural">ग्रामीण समुदाय</option>
                    <option value="township">शहर समुदाय</option>
                    <option value="colony">कॉलोनी</option>
                    <option value="other">अन्य</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="communityDetails" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                  क्षेत्र का नाम जहाँ सामाजिक उद्यमी के रूप में कार्य करना चाहेंगे (यदि लिस्ट में उपलब्ध नहीं है)
                  </label>
                  <textarea id="communityDetails" class="form-input" rows="1" placeholder="कृपया देश, राज्य, जिला, ब्लॉक,शहर, ग्राम पंचायत लिखें"
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; resize: vertical; transition: all 0.3s ease;"></textarea>
                </div>
              </div>


              <div class="row">
                <div class="col-12 mb-4">
                  <label for="message" style="color: #5a3e2b; font-weight: 600; margin-bottom: 8px; display: block;">
                   विचार या टिप्पणी
                  </label>
                  <textarea id="message" class="form-input" rows="4" placeholder="अपने विचार या संदेश साझा करें..."
                    style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; resize: vertical; transition: all 0.3s ease;"></textarea>
                </div>
              </div>

              <!-- Submit and Cancel Buttons -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <button type="button" class="cancel-btn" onclick="resetForm()"
                    style="width: 100%; background: #6c757d; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;">
                    रद्द करें
                  </button>
                </div>
                <div class="col-md-6 mb-3">
                  <button type="submit" class="submit-btn" 
                    style="width: 100%; background: #e8430a; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;">
                    जमा करे
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-3" style="background-color:#f8f9fa; border-top:1px solid #dee2e6;">
    <div class="container">
      <p class="mb-0">Privacy Policy , © Copyright Niwasi. All Rights Reserved</p>
    </div>
  </footer>

  <!-- Scroll to Top Button -->
  <button id="scrollToTop" title="Scroll to Top">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
